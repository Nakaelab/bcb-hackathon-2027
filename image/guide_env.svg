<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-env" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="laptop-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="env-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="180" fill="url(#bg-env)"/>

  <!-- Tech Dots Pattern -->
  <g opacity="0.2" fill="#0284C7">
    <circle cx="30" cy="30" r="2"/><circle cx="50" cy="30" r="2"/><circle cx="70" cy="30" r="2"/>
    <circle cx="30" cy="50" r="2"/><circle cx="50" cy="50" r="2"/><circle cx="70" cy="50" r="2"/>
    <circle cx="330" cy="130" r="2"/><circle cx="350" cy="130" r="2"/><circle cx="370" cy="130" r="2"/>
    <circle cx="330" cy="150" r="2"/><circle cx="350" cy="150" r="2"/><circle cx="370" cy="150" r="2"/>
  </g>

  <!-- Center Laptop Graphic -->
  <g transform="translate(110, 32)" filter="url(#env-shadow)">
    <!-- Laptop Screen Outer -->
    <rect x="15" y="0" width="150" height="95" rx="7" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <circle cx="90" cy="4" r="1.5" fill="#64748B"/>
    <!-- Screen Display (Google Colab style) -->
    <rect x="20" y="8" width="140" height="82" rx="3" fill="#0F172A"/>
    
    <!-- Colab Header bar -->
    <rect x="20" y="8" width="140" height="14" fill="#1E293B"/>
    <circle cx="27" cy="15" r="2.5" fill="#EF4444"/>
    <circle cx="34" cy="15" r="2.5" fill="#F59E0B"/>
    <circle cx="41" cy="15" r="2.5" fill="#10B981"/>
    <text x="50" y="18" font-family="monospace" font-size="6.5" fill="#94A3B8">colab.research.google.com</text>

    <!-- Code Editor Area -->
    <g transform="translate(24, 25)">
      <!-- Play button -->
      <circle cx="6" cy="9" r="5" fill="#0284C7"/>
      <polygon points="5,6 9,9 5,12" fill="#FFFFFF"/>
      <!-- Code lines -->
      <text x="16" y="8" font-family="monospace" font-size="6.5" fill="#38BDF8">import</text>
      <text x="42" y="8" font-family="monospace" font-size="6.5" fill="#F8FAFC">numpy as np</text>
      <text x="16" y="16" font-family="monospace" font-size="6.5" fill="#38BDF8">import</text>
      <text x="42" y="16" font-family="monospace" font-size="6.5" fill="#F8FAFC">braidyn_bc</text>
      <text x="16" y="24" font-family="monospace" font-size="6" fill="#34D399"># Ca2+ data analysis</text>
      <!-- Output Graph Wave -->
      <rect x="16" y="29" width="112" height="28" rx="2" fill="#1E293B"/>
      <polyline points="20,48 35,42 45,52 60,35 75,44 90,32 105,40 120,34" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="20,53 35,50 50,47 65,49 80,43 95,45 110,38 120,41" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>

    <!-- Laptop Base / Keyboard -->
    <path d="M 0 95 L 180 95 L 165 110 L 15 110 Z" fill="url(#laptop-body)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Trackpad -->
    <rect x="75" y="99" width="30" height="8" rx="1.5" fill="#CBD5E1"/>
  </g>

  <!-- Floating Python Badge (Left) -->
  <g transform="translate(25, 52)" filter="url(#env-shadow)">
    <rect width="70" height="68" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <g transform="translate(19, 8)">
      <path d="M 16 0 C 7 0 7 4 7 4 L 7 8 L 16 8 L 16 10 L 4 10 C 4 10 0 10 0 18 C 0 26 4 26 4 26 L 6 26 L 6 22 C 6 18 10 18 10 18 L 22 18 C 22 18 26 18 26 14 C 26 10 26 0 16 0 Z" fill="#0284C7"/>
      <circle cx="10" cy="4" r="1.5" fill="#FFFFFF"/>
      <path d="M 16 32 C 25 32 25 28 25 28 L 25 24 L 16 24 L 16 22 L 28 22 C 28 22 32 22 32 14 C 32 6 28 6 28 6 L 26 6 L 26 10 C 26 14 22 14 22 14 L 10 14 C 10 14 6 14 6 18 C 6 22 6 32 16 32 Z" fill="#F59E0B"/>
      <circle cx="22" cy="28" r="1.5" fill="#FFFFFF"/>
    </g>
    <text x="35" y="55" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9.5" font-weight="bold" fill="#0369A1">Python</text>
  </g>

  <!-- Floating OS Badges (Right) -->
  <g transform="translate(305, 48)" filter="url(#env-shadow)">
    <rect width="72" height="82" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="36" y="17" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="9.5" font-weight="bold" fill="#0369A1">持参PC</text>
    <g transform="translate(10, 24)">
      <rect width="52" height="16" rx="4" fill="#F0F9FF"/>
      <text x="26" y="11.5" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#0284C7">Windows</text>
    </g>
    <g transform="translate(10, 43)">
      <rect width="52" height="16" rx="4" fill="#F0F9FF"/>
      <text x="26" y="11.5" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#0284C7">macOS</text>
    </g>
    <g transform="translate(10, 62)">
      <rect width="52" height="16" rx="4" fill="#F0F9FF"/>
      <text x="26" y="11.5" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#0284C7">Linux</text>
    </g>
  </g>

  <!-- WiFi Indicator (Top) -->
  <g transform="translate(160, 10)" filter="url(#env-shadow)">
    <rect width="80" height="22" rx="11" fill="#0284C7"/>
    <path d="M 14 15 A 2 2 0 0 1 18 15 M 11 12 A 6 6 0 0 1 21 12 M 8 9 A 10 10 0 0 1 24 9" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="17" r="1" fill="#FFFFFF"/>
    <text x="29" y="15" font-family="'Noto Sans JP', sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF">WiFi 完備</text>
  </g>
</svg>